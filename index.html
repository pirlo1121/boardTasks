<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tablero de tareas con tres columnas, arrastrar y soltar, modo claro/oscuro y guardado automático en tu navegador.">
  <meta name="theme-color" id="themeColor" content="#eef1f7">
  <title>Tablero · Organiza tus tareas</title>

  <script>
    // Aplica el tema guardado antes de pintar para evitar el destello inicial.
    (function () {
      try {
        var saved = localStorage.getItem('trello.theme');
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light');
      } catch (e) { /* sin acceso a localStorage */ }
    })();
  </script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="4" width="5" height="16" rx="1.6"/>
            <rect x="10.5" y="4" width="5" height="10.5" rx="1.6"/>
            <rect x="17.5" y="4" width="3.5" height="13" rx="1.5"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>Tablero</h1>
          <p class="brand-sub">Organiza tu día, una tarjeta a la vez.</p>
        </div>
      </div>

      <div class="topbar-actions">
        <button id="themeToggle" class="icon-btn theme-btn" type="button" aria-label="Activar modo oscuro" title="Activar modo oscuro">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
        <button id="newTaskBtn" class="btn btn-primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Nueva tarea
        </button>
      </div>
    </header>

    <section class="toolbar" aria-label="Resumen y búsqueda">
      <div class="summary">
        <div class="summary-head">
          <span id="summaryText">Sin tareas todavía</span>
          <span class="summary-pct" id="summaryPct">0%</span>
        </div>
        <div class="progress" id="progress" role="progressbar" aria-label="Progreso del tablero" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="progressBar"></span>
        </div>
      </div>

      <label class="search" for="searchInput">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.2-3.2"/>
        </svg>
        <input id="searchInput" type="search" placeholder="Buscar tareas…" autocomplete="off">
      </label>
    </section>

    <main class="board" id="board" aria-label="Tablero de tareas"></main>

    <footer class="footer">
      <span>HTML, CSS y JavaScript · Tus tareas se guardan en <code>localStorage</code>.</span>
      <button id="clearDoneBtn" class="link-btn" type="button">Limpiar terminadas</button>
    </footer>
  </div>

  <dialog id="taskDialog" class="dialog" aria-labelledby="dialogTitle">
    <form id="taskForm" class="dialog-form" novalidate>
      <div class="dialog-head">
        <h2 id="dialogTitle">Nueva tarea</h2>
        <button id="closeDialog" class="icon-btn close-btn" type="button" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18"/>
          </svg>
        </button>
      </div>

      <input type="hidden" id="taskId">

      <label class="field" for="taskTitle">
        <span>Título</span>
        <input id="taskTitle" name="title" type="text" maxlength="80" placeholder="Ej. Diseñar la pantalla de inicio" autocomplete="off" required>
        <em class="field-error" id="titleError" role="alert"></em>
      </label>

      <div class="field-row">
        <label class="field" for="taskStatus">
          <span>Estado</span>
          <select id="taskStatus" name="status">
            <option value="pendiente">Pendiente</option>
            <option value="enProceso">En proceso</option>
            <option value="terminada">Terminada</option>
          </select>
        </label>
        <label class="field" for="taskDate">
          <span>Fecha</span>
          <input id="taskDate" name="date" type="date" required>
        </label>
      </div>

      <label class="field" for="taskDescription">
        <span>Descripción <small>(opcional)</small></span>
        <textarea id="taskDescription" name="description" rows="3" maxlength="300" placeholder="Detalles, enlaces o criterios de aceptación…"></textarea>
      </label>

      <div class="dialog-actions">
        <button id="cancelBtn" class="btn btn-ghost" type="button">Cancelar</button>
        <button id="saveBtn" class="btn btn-primary" type="submit">Crear tarea</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p style="text-align:center;padding:20px">Este tablero necesita JavaScript para funcionar.</p>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
